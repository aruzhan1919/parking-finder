<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Debug: все парковки</title>
    <style>
        html, body { margin: 0; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100vh; }
        #info {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            background: white; padding: 10px 14px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 14px;
        }
        #popup {
            position: absolute; bottom: 12px; left: 12px; right: 12px;
            max-width: 500px; background: white; padding: 12px 16px;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-size: 13px; display: none; max-height: 40vh; overflow: auto;
        }
        #popup pre { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <div id="info">Парковок загружено: <span id="count">…</span></div>
    <div id="map"></div>
    <div id="popup"></div>

    <script src="https://mapgl.2gis.com/api/js/v1"></script>
    <script>
        // ВСТАВЬ СВОЙ КЛЮЧ КАРТЫ (MapGL) — тот же, что в app.js:
        const MAPGL_KEY = '7cfbbf43-15e8-478c-a8e6-30237405fa48';

        const map = new mapgl.Map('map', {
            center: [71.430, 51.128],
            zoom: 12,
            key: MAPGL_KEY,
        });

        const popup = document.getElementById('popup');

        fetch('/api/parkings-raw')
            .then(r => r.json())
            .then(parkings => {
                document.getElementById('count').textContent = parkings.length;
                parkings.forEach(p => {
                    if (!p.point) return;
                    const marker = new mapgl.Marker(map, {
                        coordinates: [p.point.lon, p.point.lat],
                    });
                    marker.on('click', () => {
                        popup.style.display = 'block';
                        popup.innerHTML =
                            `<strong>${p.name || '(без названия)'}</strong><br>` +
                            `<small>${p.address_name || p.address?.name || ''}</small>` +
                            `<pre>${JSON.stringify(p, null, 2)}</pre>`;
                    });
                });
            })
            .catch(err => alert('Ошибка загрузки: ' + err.message));
    </script>
</body>
</html>
